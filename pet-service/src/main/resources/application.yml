server:
  port: ${PET_SERVICE_PORT:8082}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${PET_SERVICE_DB_URL:jdbc:postgresql://localhost:5434/petservicedb}
    username: ${PET_SERVICE_DB_USERNAME:joaopedroafluz}
    password: ${PET_SERVICE_DB_PASSWORD:docker}
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:database/migration
    baseline-on-migrate: true
  application:
    name: ${PET_SERVICE_NAME:pet-service}
  cloud:
    discovery:
      enabled: true
  rabbitmq:
    host: ${RABBIT_MQ_HOST:localhost}
    port: ${RABBIT_MQ_PORT:5672}
    username: ${RABBIT_MQ_USER:joaopedroafluz}
    password: ${RABBIT_MQ_PASSWORD:docker}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ANIMAL_ADOPTION_REALM_URI:http://localhost:8080/realms/animal-adoption}
          jwk-set-uri: ${KEYCLOAK_ANIMAL_ADOPTION_REALM_OPENID_URI:http://localhost:8080/realms/animal-adoption/protocol/openid-connect/certs}
  cache:
    type: redis

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  bucket: ${MINIO_BUCKET:pet-images}

rabbit:
  exchange: ${RABBIT_MQ_EXCHANGE:pet.exchange}
  adopted-routing-key: ${RABBIT_MQ_ADOPTED_ROUTING_KEY:pet.adopted}
  registered-routing-key: ${RABBIT_MQ_REGISTERED_ROUTING_KEY:pet.registered}
  deleted-routing-key: ${RABBIT_MQ_DELETED_ROUTING_KEY:pet.deleted}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: ${spring.application.name}

redis:
  host: redis
  port: 6379