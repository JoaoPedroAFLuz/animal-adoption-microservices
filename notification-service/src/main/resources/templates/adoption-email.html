<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:20px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="background-color:#4CAF50; padding:24px; text-align:center; color:#ffffff;">
                        <h1 style="margin:0; font-size:24px;">🐾 Adoption Confirmed!</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 24px;">
                        <p style="font-size:16px; color:#333;">
                            Hi <strong th:text="${userName}">User</strong>,
                        </p>
                        <p style="font-size:16px; color:#333;">
                            Congratulations! You have successfully adopted <strong th:text="${petName}">Pet</strong>.
                        </p>
                        <p style="font-size:14px; color:#666; margin-top:24px;">
                            Thank you for giving a pet a new home. We wish you and your new companion all the best!
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f9f9f9; padding:16px 24px; text-align:center;">
                        <p style="font-size:12px; color:#999; margin:0;">
                            Pet Adoption System &mdash; This is an automated message, please do not reply.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
