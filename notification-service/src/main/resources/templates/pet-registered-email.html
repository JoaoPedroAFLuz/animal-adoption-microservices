<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:Arial, sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:20px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="background-color:#2196F3; padding:24px; text-align:center; color:#ffffff;">
                        <h1 style="margin:0; font-size:24px;">🐾 New Pet Registered</h1>
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px 24px;">
                        <p style="font-size:16px; color:#333;">
                            A new pet has been registered in the system:
                        </p>
                        <table style="margin:16px 0; font-size:15px; color:#333;">
                            <tr><td style="padding:4px 16px 4px 0; font-weight:bold;">Name:</td><td th:text="${petName}">Pet</td></tr>
                            <tr><td style="padding:4px 16px 4px 0; font-weight:bold;">Species:</td><td th:text="${specie}">Dog</td></tr>
                            <tr><td style="padding:4px 16px 4px 0; font-weight:bold;">Breed:</td><td th:text="${breed}">Breed</td></tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="background-color:#f9f9f9; padding:16px 24px; text-align:center;">
                        <p style="font-size:12px; color:#999; margin:0;">
                            Pet Adoption System &mdash; Admin notification
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
